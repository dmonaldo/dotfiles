# terminfo
set -g default-terminal "tmux-256color"
set-window-option -g xterm-keys on
set -ga terminal-overrides ',*:RGB' # Enable 24 bit true colors
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # Enable undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
# set -sa terminal-overrides ',*:S

# history
set-option -g history-limit 100000

# set mouse mode
set -g mouse on
unbind-key -T root MouseDown3Pane

# disable escape timeout
set -s escape-time 0

set -s focus-events on

# claude code notification support
set -g allow-passthrough on
set -g bell-action any
set -g monitor-bell on

# remap to control-X
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# press the prefix twice (C-x C-x) to send a literal Ctrl-X through to the
# running app (e.g. Claude Code cloud-agents delete). Relies on the
# `bind C-x send-prefix` above; nothing may re-bind C-x in the prefix table.

# title
set-option -g set-titles on
set-option -g set-titles-string "#S / #W (#T)"

# window selection
unbind -n C-Left
unbind -n C-Right
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r + resize-pane -Z

# vi mode
set-window-option -g mode-keys vi
bind-key -Tcopy-mode-vi Escape send-keys -X cancel
bind-key -Tcopy-mode-vi Enter send -X copy-selection-and-cancel\; run "tmux save -|xclip -sel clip >/dev/null 2>&1"
bind-key -Tcopy-mode-vi v send-keys -X begin-selection
bind-key -Tcopy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi enter send -X copy-pipe-and-cancel  # 'xclip -in -selection clipboard'

# fix garbage fill on copy for gnome-terminal
set -s set-clipboard off

# auto-name windows (rename-window turns this off for that window):
# Claude Code panes use the conversation title Claude sets, minus its status
# glyph; other panes use the folder name, prefixed by the command unless bash
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^[0-9.]+$,#{pane_current_command}},#{=/24/…:#{s/^[^ ]+ //:pane_title}},#{?#{==:#{pane_current_command},bash},,#{pane_current_command}:}#{b:pane_current_path}}'

# close gaps in window numbers when a window is closed
set -g renumber-windows on

# theme: Catppuccin Mocha (Ghostty: theme = Catppuccin Mocha) - https://catppuccin.com/palette
# base #1e1e2e  mantle #181825  surface0 #313244  surface1 #45475a  overlay0 #6c7086
# subtext0 #a6adc8  text #cdd6f4  mauve #cba6f7  blue #89b4fa  red #f38ba8  yellow #f9e2af

# status line
set -g status-interval 3
set -g status-style 'bg=default,fg=#a6adc8'

set -g status-left '#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#6c7086]#h  #[fg=#a6adc8]%a %b %d #[fg=#cdd6f4,bold]%H:%M '

# @claude is set by ~/.claude/hooks/notify.sh: ⏳ working, ✋ needs approval, ✅ done
set -g window-status-separator ''
set -g window-status-format ' #{?window_bell_flag,#[fg=#f38ba8]⚑,#{?window_activity_flag,#[fg=#f9e2af]✱,#[fg=#6c7086]#I}}#[fg=#a6adc8] #{?@claude,#{@claude} ,}#W#{?window_zoomed_flag,#[fg=#f9e2af] +,} '
set -g window-status-current-format ' #[fg=#89b4fa,bold]#I#[fg=#cdd6f4,nobold] #{?@claude,#{@claude} ,}#W#{?automatic-rename,,#[fg=#6c7086] (#{pane_title})}#{?window_zoomed_flag,#[fg=#f9e2af] +,} '

set -g window-status-style 'bg=default,fg=#a6adc8'
set -g window-status-current-style 'bg=#313244,fg=#cdd6f4'
set -g window-status-last-style 'bg=default,fg=#a6adc8'
set -g window-status-activity-style 'bg=default,fg=#a6adc8'
set -g window-status-bell-style 'bg=default,fg=#a6adc8'

# panes, prompts, copy mode, popups
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#181825,fg=#f9e2af'
set -g message-command-style 'bg=#181825,fg=#f9e2af'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
set -g popup-border-style 'fg=#cba6f7'
set -g clock-mode-colour '#cba6f7'
set -g display-panes-active-colour '#cba6f7'
set -g display-panes-colour '#6c7086'

if-shell 'test "$(uname -s)" = Darwin' 'source-file ~/.tmux-darwin.conf'

set-environment -g 'IGNOREEOF' 1
